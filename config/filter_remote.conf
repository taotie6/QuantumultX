# ============================================================
# 远程分流规则片段（[filter_remote] 段的维护源）
# 更新日期：2026-10-28
#
# 说明：
# - Quantumult X 不支持 include 拆分文件，本文件仅作为维护源
# - 修改后需同步到 profile/QX_Config.conf 的 [filter_remote] 段
# - 上游规则（blackmatrix7 等）直接引用 master 分支原始地址，
#   不在本仓库复制镜像；上游更新自动生效，无需改动本文件
# - 新增/删除 URL 时同步维护 checks/rule_urls.txt，
#   供 GitHub Actions 规则健康检查使用
# - blackmatrix7/ios_rule_script 采用 GPL-2.0 许可证，
#   请勿将其规则文件批量复制进本仓库
# ============================================================

[filter_remote]
# 个人直连例外
https://raw.githubusercontent.com/taotie6/QuantumultX/main/rules/Qianji.list, tag=Qianji, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/taotie6/QuantumultX/main/rules/WeChatAdSettlement.list, tag=WeChatAdSettlement, force-policy=direct, update-interval=86400, opt-parser=false, enabled=true

